services:
  postgres:
    image: postgres:16
    container_name: vaultchecker-postgres
    environment:
      POSTGRES_DB: vaultchecker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - vaultchecker-pgdata:/var/lib/postgresql/data

volumes:
  vaultchecker-pgdata:
