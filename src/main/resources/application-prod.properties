# Production environment.
# Loads DATABASE_URL and JWT_SECRET from the .env.production file (parsed as a
# properties file). In a real deployment these are supplied as environment
# variables by the hosting provider, which take precedence over the file.
spring.config.import=optional:file:.env.production[.properties]

spring.datasource.url=${DATABASE_URL}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
