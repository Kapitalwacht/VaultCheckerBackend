# Development environment.
# Loads DATABASE_URL and JWT_SECRET from the committed .env.development file
# (parsed as a properties file). Values are overridden by real environment
# variables when present, so nothing environment-specific is baked into the code.
spring.config.import=optional:file:.env.development[.properties]

spring.datasource.url=${DATABASE_URL}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
