# Spring Application Name
spring.application.name=VaultChecker Platform

# Default to the development environment when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.vaultchecker.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties (secret is provided per environment via JWT_SECRET)
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# App port
server.port=${PORT:8092}

# Frontend origin used to build email verification links
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# EmailJS (verification and password recovery emails). Empty values disable email delivery.
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
emailjs.verification-template-id=${EMAILJS_VERIFICATION_TEMPLATE_ID:}
emailjs.recovery-template-id=${EMAILJS_RECOVERY_TEMPLATE_ID:}

# Stripe test-mode Payment Links used by the paid plans
stripe.payment-link.negocio=${STRIPE_PAYMENT_LINK_NEGOCIO:https://buy.stripe.com/test_aFa4gAe7ecP31fWe1ddwc00}
stripe.payment-link.cadena=${STRIPE_PAYMENT_LINK_CADENA:https://buy.stripe.com/test_9B6bJ29QY5mB8Io7CPdwc01}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
