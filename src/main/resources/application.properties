# Spring Application Name
spring.application.name=VaultChecker Platform

# Default to the development environment when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.vaultchecker.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties (secret is provided per environment via JWT_SECRET)
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# App port
server.port=${PORT:8092}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
